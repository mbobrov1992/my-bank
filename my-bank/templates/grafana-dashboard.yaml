            {
              "datasource": {
                "type": "prometheus",
                "uid": "Prometheus"
              },
              "editorMode": "builder",
              "expr": "notification_failure_total",
              "hide": false,
              "instant": false,
              "legendFormat": "{{`{{`}}instance{{`}}`}}",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "Notifications",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "Prometheus"
