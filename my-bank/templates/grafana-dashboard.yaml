                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "red",
                      "mode": "fixed"
                    }
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 8,
            "w": 9,
            "x": 0,
            "y": 8
          },
          "id": 2,
          "options": {
            "minVizHeight": 75,
            "minVizWidth": 75,
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true,
            "sizing": "auto"
          },
          "pluginVersion": "12.3.1",
          "targets": [
            {
              "editorMode": "builder",
              "expr": "accounts_transfer_cash_success_total",
              "legendFormat": "Успешные переводы",
              "range": true,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "Prometheus"
              },
              "editorMode": "builder",
              "expr": "accounts_transfer_cash_failure_total",
              "hide": false,
              "instant": false,
              "legendFormat": "Ошибки при переводах",
              "range": true,
              "refId": "B"
