replicaCount: 1

image:
  repository: docker.elastic.co/logstash/logstash
  pullPolicy: IfNotPresent

resources:
  limits:
    cpu: "500m"
    memory: "1Gi"
  requests:
    cpu: "250m"
    memory: "512Mi"

elasticsearch:
  host: "{{ .Release.Name }}-elasticsearch"
  port: 9200

config:
  logstash.yml: |
    xpack.monitoring.enabled: false

  logstash.conf: |
    input {
      kafka {
        bootstrap_servers => "${KAFKA_BOOTSTRAP_SERVERS}"
        group_id => "${KAFKA_CONSUMER_GROUP_ID}"
        topics => [ "${KAFKA_TOPIC}" ]
      }
    }
    filter {
      grok {
        match => {
          "message" => [
            "%{TIMESTAMP_ISO8601:timestamp}%{SPACE}%{LOGLEVEL:level}%{SPACE}%{NUMBER:pid:int}%{SPACE}\[%{DATA:service}\]%{SPACE}\[%{DATA:thread}\]%{SPACE}\[%{DATA:traceId},%{DATA:spanId}]%{SPACE}%{JAVACLASS:logger}%{SPACE}:%{SPACE}%{GREEDYDATA:message}",
            "%{TIMESTAMP_ISO8601:timestamp}%{SPACE}%{LOGLEVEL:level}%{GREEDYDATA:message}",
            "%{GREEDYDATA:message}"
          ]
        }
        overwrite => [ "message" ]
      }
      date {
        match => [ "timestamp", "ISO8601" ]
        target => "@timestamp"
      }
      mutate {
        strip => ["thread"]
        remove_field => [ "timestamp" ]
      }
    }
    output {
      stdout { codec => rubydebug }
      elasticsearch {
        hosts => [ "${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}" ]
        index => "${ELASTICSEARCH_INDEX_PATTERN}"
        action => "index"
      }
    }