apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "logstash.fullname" . }}
  labels:
    {{- include "logstash.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "logstash.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "logstash.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: logstash
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: {{ tpl .Values.global.kafka.bootstrapServers $ | quote }}
        - name: KAFKA_CONSUMER_GROUP_ID
          value: {{ include "logstash.fullname" . | quote }}
        - name: KAFKA_TOPIC
          value: {{ tpl .Values.global.logging.kafka.topic.name $ | quote }}
        - name: ELASTICSEARCH_HOST
          value: {{ tpl .Values.elasticsearch.host . | quote }}
        - name: ELASTICSEARCH_PORT
          value: {{ .Values.elasticsearch.port | quote }}
        - name: ELASTICSEARCH_INDEX_PATTERN
          value: "{{ .Release.Name }}-my-bank-logs-%{+dd.MM.YYYY}"
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: config
          mountPath: /usr/share/logstash/config/logstash.yml
          subPath: logstash.yml
        - name: config
          mountPath: /usr/share/logstash/pipeline/logstash.conf
          subPath: logstash.conf
      volumes:
      - name: config
        configMap:
          name: {{ include "logstash.fullname" . }}-config