java-app:
  nameOverride: "my-bank-notifications"

  replicaCount: 1

  image:
    repository: my-bank-notifications
    pullPolicy: IfNotPresent
    tag: "latest"

  imagePullSecrets: []

  serviceAccount:
    create: false
    automount: true
    annotations: {}
    name: ""

  podAnnotations: {}
  podLabels: {}

  podSecurityContext: {}

  securityContext: {}

  service:
    type: ClusterIP
    port: 8080

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []

  resources: {}

  autoscaling:
    enabled: false

  livenessProbe:
    exec:
      command: ["pgrep", "-f", "java"]
    initialDelaySeconds: 20
    timeoutSeconds: 10
    periodSeconds: 60

  readinessProbe:
    exec:
      command: ["pgrep", "-f", "java"]
    initialDelaySeconds: 20
    timeoutSeconds: 10
    periodSeconds: 60

  volumes: []

  volumeMounts: []

  nodeSelector: {}

  tolerations: []

  affinity: {}

  configmap:
    kafka:
      notifications:
        topic:
          name: "{{ .Values.global.kafka.notifications.topic.name }}"

  env:
    - name: KEYCLOAK_ISSUER_URI
      value: "{{ .Values.global.keycloak.issuerUri }}"
    - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
      value: "{{ .Values.global.kafka.bootstrapServers }}"
    - name: SPRING_KAFKA_CONSUMER_GROUP_ID
      value: "{{ .Release.Name }}-my-bank-notifications"